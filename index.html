<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پلتفرم سازنده بات بله</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0f0f1a; color: white; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 450px; background-color: #17212b; min-height: 100vh; position: relative; display: flex; flex-direction: column; }
        
        /* صفحات */
        .screen { display: none; flex-direction: column; flex: 1; }
        .screen.active { display: flex; }

        /* صفحه توکن */
        #token-screen { justify-content: center; align-items: center; padding: 20px; text-align: center; }
        #token-screen h1 { color: #5fc9f8; margin-bottom: 20px; }
        #token-screen input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #2c3e50; background: #0e1621; color: white; margin-bottom: 15px; }
        .btn-primary { width: 100%; padding: 15px; border: none; border-radius: 10px; background: linear-gradient(135deg, #5fc9f8, #1a73e8); color: white; font-weight: bold; cursor: pointer; }
        #status-text { margin-top: 15px; color: #e74c3c; font-size: 14px; }

        /* صفحه شبیه ساز بله */
        .chat-header { background: #17212b; padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #0e1621; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; }
        .chat-header .avatar { width: 40px; height: 40px; background: #5fc9f8; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-left: 10px; font-weight: bold; color: #17212b; }
        .chat-header h3 { font-size: 16px; color: white; }
        .chat-header span { font-size: 12px; color: #27c93f; }

        .chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background-color: #0e1621; }
        
        .message-bubble { background: #ffffff; color: #000000; padding: 10px 15px; border-radius: 12px 12px 12px 0; max-width: 80%; align-self: flex-start; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-size: 14px; }
        .message-bubble.editable { outline: 2px dashed #5fc9f8; cursor: text; }
        .message-bubble.editable:empty:before { content: attr(data-placeholder); color: #aaa; }
        
        /* دکمه‌های شیشه‌ای */
        .glass-buttons-container { display: flex; flex-wrap: wrap; gap: 10px; align-self: flex-start; max-width: 80%; }
        .glass-btn { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.3); color: #5fc9f8; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.2s; position: relative; }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.25); }
        .glass-btn .delete-btn-x { position: absolute; top: -5px; right: -5px; background: #e74c3c; border-radius: 50%; width: 15px; height: 15px; font-size: 10px; display: none; justify-content: center; align-items: center; color: white; }
        .glass-btn:hover .delete-btn-x { display: flex; }

        .response-setup { background: rgba(0, 0, 0, 0.3); border: 1px solid #5fc9f8; padding: 10px; border-radius: 8px; margin-top: 5px; width: 100%; }
        .response-setup textarea { width: 100%; background: #0e1621; border: 1px solid #2c3e50; color: white; border-radius: 5px; padding: 8px; font-size: 13px; resize: none; }

        .chat-footer { padding: 15px; background: #17212b; border-top: 1px solid #0e1621; }
        .chat-footer button { background: transparent; border: 1px dashed #5fc9f8; color: #5fc9f8; padding: 10px; border-radius: 10px; width: 100%; cursor: pointer; }
        .chat-footer .btn-save { background: #27c93f; color: white; border: none; margin-top: 10px; font-weight: bold; }

    </style>
</head>
<body>

<div class="app-container">
    <!-- صفحه ورود توکن -->
    <div id="token-screen" class="screen active">
        <h1>🤖 اتصال به بات بله</h1>
        <p style="color: #aaa; margin-bottom: 30px; font-size: 14px;">برای شروع، توکن ربات خود را از Bot Father بله دریافت و وارد کنید.</p>
        <input type="text" id="token-input" placeholder="123456789:ABCdefGhi...">
        <button class="btn-primary" onclick="connectBot()">اتصال به ربات</button>
        <div id="status-text"></div>
    </div>

    <!-- صفحه شبیه ساز بله -->
    <div id="simulator-screen" class="screen">
        <div class="chat-header">
            <div class="avatar" id="bot-avatar">B</div>
            <div>
                <h3 id="bot-name">ربات من</h3>
                <span>● آنلاین (در حال تست)</span>
            </div>
        </div>

        <div class="chat-area" id="chat-area">
            <!-- پیام اولیه -->
            <div class="message-bubble editable" id="welcome-msg" contenteditable="true" data-placeholder="پیام اولیه ربات را اینجا بنویسید... (مثلاً: سلام خوش اومدی!)"></div>
            
            <!-- دکمه‌های شیشه‌ای اینجا اضافه می‌شوند -->
            <div class="glass-buttons-container" id="glass-buttons"></div>
        </div>

        <div class="chat-footer">
            <button onclick="addGlassButton()">➕ افزودن دکمه شیشه‌ای</button>
            <button class="btn-save" onclick="saveAndStartBot()">✅ ذخیره و روشن کردن ربات</button>
        </div>
    </div>
</div>

<script>
    // پل ارتباطی جدید و پایدارتر برای دور زدن محدودیت
    const PROXY = 'https://api.codetabs.com/v1/proxy/?quest=';

    // متغیرهای global
    let botToken = '';
    let lastUpdateId = 0;
    let isPolling = false;

    // ۱. اتصال به بله
    async function connectBot() {
        const token = document.getElementById('token-input').value.trim();
        const statusText = document.getElementById('status-text');
        
        if(!token) { statusText.innerText = "لطفاً توکن را وارد کنید."; return; }
        
        statusText.innerText = "⏳ در حال بررسی توکن...";
        statusText.style.color = "#f39c12";

        try {
            const baleUrl = `https://tapi.bale.ir/bot${token}/getMe`;
            // استفاده از پل allorigins
            const res = await fetch(PROXY + encodeURIComponent(baleUrl));
            const data = await res.json();

            if(data.ok) {
                botToken = token;
                document.getElementById('bot-name').innerText = data.result.first_name || "ربات من";
                document.getElementById('bot-avatar').innerText = (data.result.first_name || "B").charAt(0);
                
                // تغییر صفحه
                document.getElementById('token-screen').classList.remove('active');
                document.getElementById('simulator-screen').classList.add('active');
            } else {
                statusText.innerText = "❌ توکن نامعتبر است یا بله دسترسی داده نیست.";
                statusText.style.color = "#e74c3c";
            }
        } catch (error) {
            statusText.innerText = "❌ خطا در اتصال. لطفاً دوباره تلاش کنید.";
            statusText.style.color = "#e74c3c";
            console.error(error);
        }
    }

    // ۲. ساخت دکمه شیشه‌ای
    let btnCounter = 0;
    function addGlassButton() {
        btnCounter++;
        const container = document.getElementById('glass-buttons');
        
        const btnWrapper = document.createElement('div');
        btnWrapper.style.display = 'flex';
        btnWrapper.style.flexDirection = 'column';
        btnWrapper.style.width = '100%';

        const btn = document.createElement('button');
        btn.className = 'glass-btn';
        btn.innerText = 'دکمه جدید';
        btn.contentEditable = true;
        btn.style.outline = 'none';
        
        const delBtn = document.createElement('span');
        delBtn.className = 'delete-btn-x';
        delBtn.innerText = '✖';
        delBtn.onclick = () => btnWrapper.remove();

        const setupDiv = document.createElement('div');
        setupDiv.className = 'response-setup';
        setupDiv.style.display = 'none';
        
        const label = document.createElement('label');
        label.innerText = 'وقتی کاربر این دکمه را زد، این پیام ارسال شود:';
        label.style.display = 'block';
        label.style.marginBottom = '5px';
        label.style.fontSize = '12px';
        label.style.color = '#ccc';
        
        const textarea = document.createElement('textarea');
        textarea.rows = 2;
        textarea.placeholder = 'مثلاً: شما دکمه X را فشردید...';

        setupDiv.appendChild(label);
        setupDiv.appendChild(textarea);

        btn.onclick = (e) => {
            if(e.detail === 1) {
                setupDiv.style.display = setupDiv.style.display === 'none' ? 'block' : 'none';
            }
        };

        btn.appendChild(delBtn);
        btnWrapper.appendChild(btn);
        btnWrapper.appendChild(setupDiv);
        container.appendChild(btnWrapper);
    }

    // ۳. ذخیره و روشن کردن ربات
    function saveAndStartBot() {
        if (isPolling) {
            alert("ربات از قبل روشن است و منتظر دریافت /start است.");
            return;
        }
        isPolling = true;
        alert("✅ ربات روشن شد! حالا به بله بروید و /start را بفرستید.\n(این صفحه نباید بسته شود)");
        pollUpdates();
    }

    // ۴. دریافت پیام‌ها از بله (Long Polling)
    async function pollUpdates() {
        if (!isPolling) return;
        
        try {
            const url = `https://tapi.bale.ir/bot${botToken}/getUpdates?offset=${lastUpdateId}&timeout=30`;
            const res = await fetch(PROXY + encodeURIComponent(url));
            const data = await res.json();

            if(data.ok) {
                for (let update of data.result) {
                    lastUpdateId = update.update_id + 1;
                    
                    if(update.message && update.message.text === '/start') {
                        sendWelcomeMessage(update.message.chat.id);
                    }
                    
                    if(update.callback_query) {
                        handleButtonClick(update.callback_query);
                    }
                }
            }
        } catch (error) { console.error("Polling Error:", error); }

        setTimeout(pollUpdates, 2000); 
    }

    // ۵. ارسال پیام اولیه و دکمه‌ها
    async function sendWelcomeMessage(chatId) {
        const welcomeText = document.getElementById('welcome-msg').innerText.trim() || "سلام!";
        
        let keyboard = [];
        const buttons = document.querySelectorAll('#glass-buttons .glass-btn');
        buttons.forEach((btn, index) => {
            const text = btn.innerText.replace('✖', '').trim();
            if(text) {
                keyboard.push([{ text: text, callback_data: `btn_${index}` }]);
            }
        });

        let replyMarkup = keyboard.length > 0 ? JSON.stringify({ inline_keyboard: keyboard }) : null;

        let baleUrl = `https://tapi.bale.ir/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(welcomeText)}`;
        if(replyMarkup) baleUrl += `&reply_markup=${encodeURIComponent(replyMarkup)}`;

        await fetch(PROXY + encodeURIComponent(baleUrl));
    }

    // ۶. پاسخ به کلیک روی دکمه‌ها
    async function handleButtonClick(callbackQuery) {
        const chatId = callbackQuery.message.chat.id;
        const data = callbackQuery.data;
        
        const index = parseInt(data.split('_')[1]);
        const buttons = document.querySelectorAll('#glass-buttons .glass-btn');
        
        if(buttons[index]) {
            const setupDiv = buttons[index].nextElementSibling;
            const responseText = setupDiv.querySelector('textarea').value.trim() || "پاسخی تعریف نشده است.";
            
            const baleUrl = `https://tapi.bale.ir/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(responseText)}`;
            await fetch(PROXY + encodeURIComponent(baleUrl));
            
            const ansUrl = `https://tapi.bale.ir/bot${botToken}/answerCallbackQuery?callback_query_id=${callbackQuery.id}&text=انجام شد!`;
            await fetch(PROXY + encodeURIComponent(ansUrl));
        }
    }
</script>

</body>
</html>
