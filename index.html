<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سازنده اپلیکیشن بدون کد</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&family=Estedad:wght@400;700&family=Lalezar&family=Gulzar&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <div id="home-screen" class="screen active">
        <div class="card" onclick="goToBuilder()">
            <div class="card-text">
                <h2>ساخت اپ موبایل</h2>
                <span>اپلیکیشن وب و اندروید</span>
            </div>
            <div class="card-icon">📱</div>
        </div>
    </div>

    <div id="builder-screen" class="screen">
        <div class="builder-header" id="builder-header">
            <button class="header-btn" onclick="goToHome()">⟵</button>
            <select id="page-switcher" class="page-switcher" onchange="switchPage(this.value)"></select>
            <div style="display:flex; gap:10px; margin-right:auto;">
                <button class="header-btn" onclick="toggleDeviceView()" title="تغییر نمایش">🖥️</button>
                <button class="header-btn" onclick="startSimulation()" title="شبیه‌سازی">▶️</button>
                <button class="header-btn" onclick="showView('view-main'); openDrawer();" title="افزودن">➕</button>
            </div>
        </div>
        
        <div class="builder-header" id="simulator-header" style="display:none; background:#0e1621;">
            <button class="header-btn" onclick="stopSimulation()">⏹️</button>
            <h3>حالت شبیه‌سازی</h3>
            <div style="margin-right:auto;"><button class="header-btn" onclick="restartSimulation()">🔄</button></div>
        </div>

        <div class="canvas-area" id="canvas"></div>
    </div>

    <div class="drawer-overlay" id="overlay" onclick="closeDrawerAndDeselect()"></div>
    
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <h4 id="drawer-title">افزودن المان</h4>
            <button class="header-btn" onclick="closeDrawerAndDeselect()">✖</button>
        </div>
        <div class="drawer-content">
            <div id="view-main" class="drawer-view active">
                <div class="menu-item" onclick="showView('view-pages')"><span>📄 صفحات</span><span>›</span></div>
                <div class="menu-item" onclick="showView('view-button-list')"><span>🔘 دکمه</span><span>›</span></div>
                <div class="menu-item" onclick="showView('view-text-list')"><span>✍️ متن</span><span>›</span></div>
                <div class="menu-item" onclick="showView('view-image-list')"><span>🖼️ تصویر</span><span>›</span></div>
                <div class="menu-item" onclick="showView('view-switch-list')"><span>🎚️ سوئیچ (بولین)</span><span>›</span></div>
                <div class="menu-item" onclick="showView('view-input-list')"><span>⌨️ فیلد متنی</span><span>›</span></div>
            </div>

            <!-- صفحات -->
            <div id="view-pages" class="drawer-view">
                <button class="back-btn" onclick="showView('view-main')">⟵ بازگشت</button>
                <button class="btn-add" onclick="prepareNewPage()">➕ ساخت صفحه جدید</button>
                <div id="existing-pages"></div>
            </div>
            <div id="view-page-settings" class="drawer-view">
                <button class="back-btn" onclick="showView('view-pages')">⟵ بازگشت</button>
                <div class="form-group"><label>نام صفحه</label><input type="text" id="page-name" class="form-control" oninput="updatePageData()"></div>
                <div class="form-group"><label>رنگ پس‌زمینه صفحه</label><input type="color" id="page-bg-color" class="color-input" onchange="updatePageData()"></div>
                <button class="btn-save" id="page-create" style="display:none;" onclick="createPageFromSettings()">✅ ساخت صفحه</button>
                <button class="btn-save" id="page-set-home" style="background:#f39c12; margin-bottom:10px;" onclick="setAsHomePage()">🌟 تنظیم به عنوان صفحه اصلی</button>
                <button class="btn-danger" id="page-delete" onclick="deleteSelectedPage()">🗑 حذف این صفحه</button>
            </div>

            <!-- دکمه‌ها -->
            <div id="view-button-list" class="drawer-view">
                <button class="back-btn" onclick="showView('view-main')">⟵ بازگشت</button>
                <button class="btn-add" onclick="prepareNewElement('button')">➕ ساخت دکمه</button>
                <div id="existing-buttons" class="el-list"></div>
            </div>
            <div id="view-button-settings" class="drawer-view">
                <button class="back-btn" onclick="showView('view-button-list')">⟵ بازگشت</button>
                <div class="form-group"><label>متن دکمه</label><input type="text" id="btn-text" class="form-control" oninput="updateElement()"></div>
                <div class="form-row">
                    <div class="form-group"><label>عرض</label><input type="number" id="btn-width" class="form-control" oninput="updateElement()"></div>
                    <div class="form-group"><label>ارتفاع</label><input type="number" id="btn-height" class="form-control" oninput="updateElement()"></div>
                </div>
                <div class="form-group"><label>فونت دکمه</label>
                    <select id="btn-font" class="form-control" onchange="updateElement()">
                        <option value="Vazirmatn">وزیرمتن (ساده)</option>
                        <option value="Estedad">استداد (مدرن)</option>
                        <option value="Lalezar">لاله‌زار (فانتزی)</option>
                        <option value="Gulzar">گلزار (تحریری)</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>اندازه فونت</label><input type="number" id="btn-font-size" value="16" class="form-control" oninput="updateElement()"></div>
                    <div class="form-group"><label>کلفتی</label>
                        <select id="btn-font-weight" class="form-control" onchange="updateElement()">
                            <option value="normal">عادی</option>
                            <option value="bold">ضخیم</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>رنگ متن دکمه</label><input type="color" id="btn-text-color" class="color-input" value="#17212b" onchange="updateElement()"></div>
                    <div class="form-group"><label>رنگ دکمه</label><input type="color" id="btn-bg-color" class="color-input" onchange="updateElement()"></div>
                </div>
                <div class="transparent-toggle" style="margin-bottom:15px;"><input type="checkbox" id="btn-bg-transparent" onchange="toggleTransparent(this, 'btn-bg-color')"> شفاف (بدون رنگ)</div>
                <div class="form-row">
                    <div class="form-group"><label>رنگ نوار دور</label><input type="color" id="btn-border-color" class="color-input" onchange="updateElement()"></div>
                    <div class="form-group"><label>ضخامت نوار</label><input type="number" id="btn-border-width" class="form-control" value="2" min="0" max="20" oninput="updateElement()"></div>
                </div>
                <div class="transparent-toggle" style="margin-bottom:15px;"><input type="checkbox" id="btn-border-transparent" onchange="toggleTransparent(this, 'btn-border-color')"> شفاف (بدون نوار)</div>
                <div class="form-group"><label>شکل دکمه</label>
                    <select id="btn-shape" class="form-control" onchange="updateElement()">
                        <option value="8">مربع گرد</option><option value="0">مربع تیز</option><option value="30">کپسولی</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>اتصال به صفحه (برای شبیه‌سازی)</label>
                    <select id="btn-link-page" class="form-control" onchange="updateElement()"></select>
                </div>
                <button class="btn-save" id="btn-create" style="display:none;" onclick="createElementFromSettings('button')">✅ ساخت دکمه</button>
                <button class="btn-danger" id="btn-delete" onclick="deleteSelectedElement()">🗑 حذف این دکمه</button>
            </div>

            <!-- متن‌ها -->
            <div id="view-text-list" class="drawer-view">
                <button class="back-btn" onclick="showView('view-main')">⟵ بازگشت</button>
                <button class="btn-add" onclick="prepareNewElement('text')">➕ ساخت متن</button>
                <div id="existing-texts" class="el-list"></div>
            </div>
            <div id="view-text-settings" class="drawer-view">
                <button class="back-btn" onclick="showView('view-text-list')">⟵ بازگشت</button>
                <div class="form-group"><label>متن</label><textarea id="txt-content" rows="3" class="form-control" oninput="updateElement()"></textarea></div>
                <div class="form-group"><label>فونت</label>
                    <select id="txt-font" class="form-control" onchange="updateElement()">
                        <option value="Vazirmatn">وزیرمتن (ساده)</option>
                        <option value="Estedad">استداد (مدرن)</option>
                        <option value="Lalezar">لاله‌زار (فانتزی)</option>
                        <option value="Gulzar">گلزار (تحریری)</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>کلفتی</label>
                        <select id="txt-weight" class="form-control" onchange="updateElement()">
                            <option value="normal">عادی</option><option value="bold">ضخیم</option>
                        </select>
                    </div>
                    <div class="form-group"><label>اندازه فونت</label><input type="number" id="txt-size" class="form-control" value="16" oninput="updateElement()"></div>
                </div>
                <div class="form-group"><label>رنگ متن</label><input type="color" id="txt-color" class="color-input" value="#ffffff" onchange="updateElement()"></div>
                <button class="btn-save" id="txt-create" style="display:none;" onclick="createElementFromSettings('text')">✅ ساخت متن</button>
                <button class="btn-danger" id="txt-delete" onclick="deleteSelectedElement()">🗑 حذف این متن</button>
            </div>

            <!-- تصاویر -->
            <div id="view-image-list" class="drawer-view">
                <button class="back-btn" onclick="showView('view-main')">⟵ بازگشت</button>
                <button class="btn-add" onclick="prepareNewElement('image')">➕ ساخت تصویر</button>
                <div id="existing-images" class="el-list"></div>
            </div>
            <div id="view-image-settings" class="drawer-view">
                <button class="back-btn" onclick="showView('view-image-list')">⟵ بازگشت</button>
                <div class="form-group">
                    <label>آپلود تصویر</label>
                    <label for="img-upload" class="file-upload-label">برای انتخاب کلیک کنید</label>
                    <input type="file" id="img-upload" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
                    <img id="img-preview" />
                </div>
                <div class="form-row">
                    <div class="form-group"><label>عرض</label><input type="number" id="img-width" class="form-control" value="150" oninput="updateElement()"></div>
                    <div class="form-group"><label>ارتفاع</label><input type="number" id="img-height" class="form-control" value="150" oninput="updateElement()"></div>
                </div>
                <button class="btn-save" id="img-create" style="display:none;" onclick="createElementFromSettings('image')">✅ ساخت تصویر</button>
                <button class="btn-danger" id="img-delete" onclick="deleteSelectedElement()">🗑 حذف این تصویر</button>
            </div>

            <!-- سوئیچ (بولین) -->
            <div id="view-switch-list" class="drawer-view">
                <button class="back-btn" onclick="showView('view-main')">⟵ بازگشت</button>
                <button class="btn-add" onclick="prepareNewElement('switch')">➕ ساخت سوئیچ</button>
                <div id="existing-switches" class="el-list"></div>
            </div>
            <div id="view-switch-settings" class="drawer-view">
                <button class="back-btn" onclick="showView('view-switch-list')">⟵ بازگشت</button>
                <div class="form-group"><label>متن کنار سوئیچ</label><input type="text" id="sw-text" class="form-control" value="فعالسازی" oninput="updateElement()"></div>
                <div class="form-group"><label>نوع سوئیچ</label>
                    <select id="sw-type" class="form-control" onchange="updateElement()">
                        <option value="toggle">دایره متحرک (Toggle)</option>
                        <option value="checkbox">مربع تیک‌دار (Checkbox)</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>رنگ سوئیچ (روشن)</label><input type="color" id="sw-on-color" class="color-input" value="#27c93f" onchange="updateElement()"></div>
                    <div class="form-group"><label>رنگ متن</label><input type="color" id="sw-text-color" class="color-input" value="#ffffff" onchange="updateElement()"></div>
                </div>
                <button class="btn-save" id="sw-create" style="display:none;" onclick="createElementFromSettings('switch')">✅ ساخت سوئیچ</button>
                <button class="btn-danger" id="sw-delete" onclick="deleteSelectedElement()">🗑 حذف این سوئیچ</button>
            </div>

            <!-- فیلد متنی (Input) -->
            <div id="view-input-list" class="drawer-view">
                <button class="back-btn" onclick="showView('view-main')">⟵ بازگشت</button>
                <button class="btn-add" onclick="prepareNewElement('input')">➕ ساخت فیلد متنی</button>
                <div id="existing-inputs" class="el-list"></div>
            </div>
            <div id="view-input-settings" class="drawer-view">
                <button class="back-btn" onclick="showView('view-input-list')">⟵ بازگشت</button>
                <div class="form-group"><label>متن راهنما (Placeholder)</label><input type="text" id="in-placeholder" class="form-control" value="متن خود را وارد کنید" oninput="updateElement()"></div>
                <div class="form-row">
                    <div class="form-group"><label>عرض</label><input type="number" id="in-width" class="form-control" value="200" oninput="updateElement()"></div>
                    <div class="form-group"><label>ارتفاع</label><input type="number" id="in-height" class="form-control" value="40" oninput="updateElement()"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>رنگ پس‌زمینه</label><input type="color" id="in-bg-color" class="color-input" value="#0e1621" onchange="updateElement()"></div>
                    <div class="form-group"><label>رنگ متن (فونت)</label><input type="color" id="in-text-color" class="color-input" value="#ffffff" onchange="updateElement()"></div>
                </div>
                <div class="form-group"><label>رنگ نوار دور</label><input type="color" id="in-border-color" class="color-input" value="#2c3e50" onchange="updateElement()"></div>
                <button class="btn-save" id="in-create" style="display:none;" onclick="createElementFromSettings('input')">✅ ساخت فیلد</button>
                <button class="btn-danger" id="in-delete" onclick="deleteSelectedElement()">🗑 حذف این فیلد</button>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
